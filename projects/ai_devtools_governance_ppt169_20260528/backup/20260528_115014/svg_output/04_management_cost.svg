<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
<linearGradient id="sidebarGradient" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#8DECC1" />
<stop offset="100%" stop-color="#00AA64" />
</linearGradient>
</defs>
<g id="background-page">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
<rect x="0" y="0" width="96" height="720" fill="url(#sidebarGradient)" />
<circle cx="-12" cy="86" r="132" fill="#C8F9D9" fill-opacity="0.62" />
<circle cx="-34" cy="198" r="170" fill="#A7F3D0" fill-opacity="0.42" />
<circle cx="-22" cy="352" r="184" fill="#6EE7B7" fill-opacity="0.24" />
<image href="../templates/images/reference_import_assets/image2.emf" x="18" y="666" width="34" height="42" preserveAspectRatio="none" />
</g>
<g id="page-header">
<text x="170" y="118" text-anchor="start" xml:space="preserve" font-family="Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" letter-spacing="1.5" transform="rotate(90 48 186)">COST</text>
<text x="170" y="118" text-anchor="start" xml:space="preserve" font-family="Calibri Light, Arial, sans-serif" font-size="34" fill="#111827" font-weight="bold">問題的管理成本</text>
<rect x="170" y="145" width="936" height="54" rx="12" fill="#F4FBF8" stroke="#D7E8DF" />
<text x="194" y="179" text-anchor="start" xml:space="preserve" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#111827">真正昂貴的不是單一錯誤，而是流程被持續打亂與放大。</text>
</g>
<g id="team-impact-card">
<rect x="170" y="228" width="448" height="360" rx="18" fill="#FFFFFF" stroke="#D7E8DF" />
<rect x="170" y="228" width="448" height="54" rx="18" fill="#00AA64" />
<text x="198" y="263" text-anchor="start" xml:space="preserve" font-family="Calibri Light, Arial, sans-serif" font-size="26" fill="#FFFFFF" font-weight="bold">對團隊的直接影響</text>
<text x="202" y="332" text-anchor="start" xml:space="preserve" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#111827">
<tspan x="202" dy="0">• 工程師反覆花時間修正方向偏差</tspan>
<tspan x="202" dy="42">• Review 需要辨識哪些修改才真正重要</tspan>
<tspan x="202" dy="42">• 來回修補與重工持續拖慢專案節奏</tspan>
<tspan x="202" dy="42">• 無關變更累積，維護成本同步上升</tspan>
</text>
</g>
<g id="management-signal-card">
<rect x="662" y="228" width="448" height="360" rx="18" fill="#FFFFFF" stroke="#D7E8DF" />
<rect x="662" y="228" width="448" height="54" rx="18" fill="#2BCB8A" />
<text x="690" y="263" text-anchor="start" xml:space="preserve" font-family="Calibri Light, Arial, sans-serif" font-size="26" fill="#FFFFFF" font-weight="bold">對決策層的訊號</text>
<text x="694" y="332" text-anchor="start" xml:space="preserve" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#111827">
<tspan x="694" dy="0">• 主管該關心的是系統性放大，不是偶發失誤</tspan>
<tspan x="694" dy="42">• 沒有治理機制時，錯誤會在流程中反覆擴散</tspan>
<tspan x="694" dy="42">• 工具越普及，管理成本越需要前置設計</tspan>
<tspan x="694" dy="42">• 核心議題是流程控制，不只是模型表現</tspan>
</text>
</g>
</svg>