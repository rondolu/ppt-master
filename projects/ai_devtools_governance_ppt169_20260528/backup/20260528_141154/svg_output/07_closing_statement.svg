<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
<linearGradient id="closingSidebarGradient" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#8DECC1" />
<stop offset="100%" stop-color="#00AA64" />
</linearGradient>
</defs>
<g id="background-closing">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
<rect x="0" y="0" width="96" height="720" fill="url(#closingSidebarGradient)" />
<circle cx="-12" cy="86" r="132" fill="#C8F9D9" fill-opacity="0.62" />
<circle cx="-34" cy="198" r="170" fill="#A7F3D0" fill-opacity="0.42" />
<circle cx="-22" cy="352" r="184" fill="#6EE7B7" fill-opacity="0.24" />
<image href="../templates/images/reference_import_assets/image2.emf" x="18" y="666" width="34" height="42" preserveAspectRatio="none" />
</g>
<g id="closing-header">
<text x="170" y="118" text-anchor="start" xml:space="preserve" font-family="Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" letter-spacing="1.5" transform="rotate(90 48 186)">CLOSING</text>
<text x="170" y="118" text-anchor="start" xml:space="preserve" font-family="Calibri Light, Arial, sans-serif" font-size="34" fill="#111827" font-weight="bold">結語</text>
<rect x="170" y="145" width="936" height="54" rx="12" fill="#F4FBF8" stroke="#D7E8DF" />
<text x="194" y="179" text-anchor="start" xml:space="preserve" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#111827">組織真正要建立的，不只是會用 AI，而是用對 AI。</text>
</g>
<g id="closing-main-card">
<rect x="170" y="236" width="940" height="214" rx="20" fill="#FFFFFF" stroke="#D7E8DF" />
<rect x="170" y="236" width="940" height="12" rx="6" fill="#00AA64" />
<text x="208" y="308" text-anchor="start" xml:space="preserve" font-family="Calibri Light, Arial, sans-serif" font-size="34" fill="#111827" font-weight="bold">
<tspan x="208" dy="0">可規模化的 AI 開發流程，</tspan>
<tspan x="208" dy="48">不是讓模型無限制參與，</tspan>
<tspan x="208" dy="48">而是先定義能做什麼、不能做什麼、何時算完成</tspan>
</text>
</g>
<g id="closing-takeaways">
<rect x="170" y="486" width="448" height="112" rx="18" fill="#F4FBF8" stroke="#D7E8DF" />
<text x="202" y="528" text-anchor="start" xml:space="preserve" font-family="Calibri, Arial, sans-serif" font-size="18" fill="#111827">
<tspan x="202" dy="0">• 先定義哪些事情可以做、哪些不能做</tspan>
<tspan x="202" dy="32">• 先定義做到什麼程度，才算真正完成</tspan>
<tspan x="202" dy="32">• 規則、驗收、邊界建立後，AI 才能變成組織能力</tspan>
</text>
</g>
<g id="closing-english-card">
<rect x="662" y="486" width="448" height="112" rx="18" fill="#00AA64" />
<text x="694" y="534" text-anchor="start" xml:space="preserve" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold">Use AI well, not just often.</text>
<text x="694" y="568" text-anchor="start" xml:space="preserve" font-family="Calibri, Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold">Rules turn tools into capability.</text>
</g>
</svg>